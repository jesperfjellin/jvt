# Synthetic Demo Configuration for JVT
# Use: docker-compose -f docker-compose.yml -f docker-compose.synthetic.yml up

services:
  jvt-data-simulator:
    # Override the data simulator to use synthetic changes instead of OSM
    command: 
      - bash
      - -c
      - |
        echo "[$(date)] Starting SYNTHETIC data simulation with debugging..."
        echo "[$(date)] Waiting 60 seconds for setup to complete..."
        sleep 60
        echo "[$(date)] Checking if initial data exists..."
        DATA_COUNT=$$(psql "$$DATABASE_URL" -t -c 'SELECT COUNT(*) FROM demo_points;' 2>/dev/null | tr -d ' ' || echo '0')
        echo "[$(date)] Found $$DATA_COUNT demo points"
        if [ "$$DATA_COUNT" = "0" ]; then
          echo "[$(date)] No initial data found, running generator..."
          /usr/local/bin/synthetic_global_generator.sh
        else
          echo "[$(date)] Initial data exists, starting change simulation..."
        fi
        echo "[$(date)] Starting continuous synthetic change simulation..."
        while true; do 
          echo "[$(date)] Running change simulation cycle..."
          /usr/local/bin/synthetic_change_simulator.sh
          echo "[$(date)] Sleeping 120 seconds before next cycle..."
          sleep 120
        done
    volumes:
      - ./logs:/var/log/tiles
      - ./scripts:/usr/local/bin:ro

  # Optional: Add a one-time synthetic data generator service
  jvt-synthetic-setup:
    build: .
    container_name: jvt-synthetic-setup
    depends_on:
      postgres:
        condition: service_healthy
      jvt-worker:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/gis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./logs:/var/log/tiles
      - ./scripts:/usr/local/bin:ro
    command: >
      bash -c "
      echo '[$(date)] Setting up synthetic global demo data...' >> /var/log/tiles/synthetic-setup.log;
      sleep 15;
      /usr/local/bin/synthetic_global_generator.sh >> /var/log/tiles/synthetic-setup.log 2>&1;
      echo '[$(date)] Synthetic setup complete!' >> /var/log/tiles/synthetic-setup.log;
      "
    restart: "no"  # Run once and exit