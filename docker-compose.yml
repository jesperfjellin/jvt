services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: jvt-postgres
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      # Database data on C drive (will grow to ~1TB) - clean Docker volume
      - postgres_data:/var/lib/postgresql/data
      # Init scripts for database setup
      - ./init-scripts:/docker-entrypoint-initdb.d
      # Map your planet file on C drive for import
      - /mnt/c/_data/GIS/osm:/data/osm:ro
    ports:
      - "5432:5432"
    command: >
      postgres 
      -c shared_buffers=2GB
      -c effective_cache_size=8GB
      -c maintenance_work_mem=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis"]
      interval: 10s
      timeout: 5s
      retries: 5

  jvt-worker:
    build: .
    container_name: jvt-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/gis
      RUST_LOG: ${RUST_LOG:-info}
      PMTILES_ARCHIVE_PATH: /var/lib/pmtiles/planet.pmtiles
    ports:
      - "8080:8080"  # API server port
    volumes:
      # PMTiles archive on C drive (will grow large over time)  
      - pmtiles_data:/var/lib/pmtiles
      # Logs on local drive for easy access
      - ./logs:/var/log/tiles
      # Map your planet file on C drive for import
      - /mnt/c/_data/GIS/osm:/data/osm:ro
      # Hot-reload scripts without rebuild
      - ./scripts:/usr/local/scripts:ro
    restart: unless-stopped


  jvt-data-simulator:
    build: .
    container_name: jvt-data-simulator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/gis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./logs:/var/log/tiles
      - ./scripts:/usr/local/scripts:ro
    command: >
      bash -c "
      echo '[$(date)] Starting continuous data simulation...' >> /var/log/tiles/data-simulation.log;
      while true; do /usr/local/scripts/test_data_pipeline.sh >> /var/log/tiles/data-simulation.log 2>&1;
      echo '[$(date)] Sleeping 60 seconds...' >> /var/log/tiles/data-simulation.log; sleep 60; done
      "

    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jvt-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  postgres_data:
  pmtiles_data:

networks:
  default:
    name: jvt-network 